<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Container Home VR — Version 3</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#a9c8cc;font-family:Arial,sans-serif}
#hud{position:fixed;z-index:20;top:12px;left:12px;max-width:430px;background:rgba(15,20,20,.82);color:#fff;padding:14px 16px;border-radius:14px}
#hud b{display:block;margin-bottom:5px}.small{font-size:12px;opacity:.82;line-height:1.45}
#room{margin-top:6px;color:#8ed7ff}
</style>
</head>
<body>
<div id="hud"><b>Container Home — Quest 2 v3</b>
<div class="small">Press ENTER VR. In VR, use the left thumbstick to walk. Point a controller at a blue floor marker and press the trigger to teleport. Blue markers are also clickable on a normal screen.</div>
<div id="room">Front veranda</div></div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";
import {VRButton} from "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/webxr/VRButton.js";

const scene=new THREE.Scene();
scene.background=new THREE.Color(0xa9c8cc);
scene.fog=new THREE.Fog(0xa9c8cc,42,105);

const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.05,200);
camera.position.set(0,1.62,0);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.xr.enabled=true;
document.body.appendChild(renderer.domElement);
document.body.appendChild(VRButton.createButton(renderer));

const roomText=document.getElementById("room");
const rig=new THREE.Group();
rig.position.set(0,0,20);
scene.add(rig);
rig.add(camera);

scene.add(new THREE.HemisphereLight(0xffffff,0x50644f,2.2));
const sun=new THREE.DirectionalLight(0xfff4df,2.4);
sun.position.set(-20,28,22); scene.add(sun);

const M=(c,rough=.8)=>new THREE.MeshStandardMaterial({color:c,roughness:rough});
const concrete=M(0xd7d0c4), container=M(0x22282a), container2=M(0x303638), wood=M(0x8c6748);
const floor=M(0xb8a78e), white=M(0xe9e3d9), fabric=M(0x777067), dark=M(0x343434), green=M(0x4d704d);
const glass=new THREE.MeshPhysicalMaterial({color:0x8fb8bd,transparent:true,opacity:.35,roughness:.08,metalness:.05});

function box(x,y,z,w,h,d,mat,ry=0){
 const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
 o.position.set(x,y,z);o.rotation.y=ry;scene.add(o);return o;
}
function cyl(x,y,z,r,h,mat){
 const o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,24),mat);
 o.position.set(x,y,z);scene.add(o);return o;
}
function ridgeWall(x,y,z,w,h,d,vertical=true){
 box(x,y,z,w,h,d,container);
 const n=vertical?Math.floor(w/.42):Math.floor(d/.42);
 for(let i=0;i<n;i++){
   if(vertical) box(x-w/2+.22+i*.42,y,z-d/2-.025,.08,h,.08,container2);
   else box(x-d/2-.025,y,z-w/2+.22+i*.42,.08,h,.08,container2);
 }
}

/* SITE */
box(0,-.1,0,78,.2,82,green);
box(0,.01,0,70,.04,74,M(0x84986f));

/* FLOORS */
box(-20,.12,0,16,.24,40,floor);
box(0,.12,-1,24,.24,28,concrete);
box(20,.12,0,16,.24,40,floor);

/* CONTAINER WINGS */
ridgeWall(-20,2,0,16,3.76,40,true);
ridgeWall(20,2,0,16,3.76,40,true);

/* inner face openings / bedroom separators */
box(-12.05,2,0,.18,3.35,40,concrete);
box(12.05,2,0,.18,3.35,40,concrete);

/* fixed glass fronts */
box(-20,2,19.02,14.2,3.15,.10,glass);
box(20,2,19.02,14.2,3.15,.10,glass);

/* CENTER BLOCK: open front and rear */
box(-11.9,2,-1,.25,3.8,28,concrete);
box(11.9,2,-1,.25,3.8,28,concrete);
box(0,3.45,-14.9,24,.7,.25,concrete);
box(0,3.45,12.9,24,.7,.25,concrete);

/* GABLE ROOF */
box(-5.9,4.85,-1,13.5,.30,31,container,THREE.MathUtils.degToRad(-12));
box(5.9,4.85,-1,13.5,.30,31,container,THREE.MathUtils.degToRad(12));
box(0,4.38,-1,23,.16,26,wood);

/* VERANDA */
box(0,.25,16.2,28,.5,8,wood);
box(-10,2.15,15.7,.35,4.0,.35,dark);
box(10,2.15,15.7,.35,4.0,.35,dark);
box(0,4.1,15.7,21,.28,.28,wood);

/* CENTER FRONT DOOR */
box(0,1.9,12.72,3.3,3.2,.18,wood);
box(-2.7,2,12.8,2.3,3,.10,glass);
box(2.7,2,12.8,2.3,3,.10,glass);

/* OPEN PLAN FLOOR ZONING */
box(0,.16,5,22,.10,10,M(0xc9bda9));
box(0,.17,-5,22,.10,9,M(0xd1c5b2));

/* LIVING ROOM */
box(0,.62,5.2,7.5,.45,2.3,fabric);
box(-4.6,.62,5.2,2.3,.45,5.4,fabric);
box(4.6,.62,5.2,2.3,.45,5.4,fabric);
box(0,.48,2.2,2.2,.35,1.35,wood);
cyl(0,.66,5.2,.25,.12,dark);

/* DINING LEFT */
box(-6.4,.78,-4.0,5.4,.16,2.6,wood);
for(const x of [-8.4,-6.4,-4.4]){box(x,.62,-5.7,1.0,.45,.55,fabric);box(x,.62,-2.3,1.0,.45,.55,fabric)}

/* KITCHEN REAR */
box(3.0,.78,-9.2,9.2,.9,2.4,white);
box(7.6,1.55,-9.2,1.0,1.0,2.2,container2);
for(const x of [0.2,2.0,3.8,5.6]) cyl(x,1.35,-7.7,.16,.65,dark);

/* rear counter */
box(0,-0+1.0,-13.1,18,.75,.8,white);

/* LAUNDRY, beside kitchen with outside access */
box(8.9,1.0,-8.0,3.8,1.6,3.0,white);
box(10.9,1.8,-8.0,.25,2.1,2.6,dark);

/* BEDROOMS */
function bed(x,z){
 box(x,.55,z,6.8,.45,5.8,white);
 box(x,.85,z-2.2,6.5,.12,.7,wood);
}
bed(-20,8.2);bed(-20,-10.2);bed(20,7.0);

/* SHARED BATH BETWEEN LEFT BEDROOMS */
box(-12.2,1.9,-1.0,.25,3.3,7.0,concrete);
box(-14.0,1.9,-1.0,3.3,3.3,7.0,white);
box(-14.0,1.1,0.2,2.2,.8,1.0,glass);
cyl(-14.0,.55,-2.6,.55,.12,white);

/* PRIVACY PARTITION */
box(-12.3,1.7,3.1,.35,2.8,3.2,wood);

/* MASTER ENSUITE + WIR */
box(14.0,1.9,-4.0,3.4,3.3,8.0,white);
box(17.2,1.8,-4.0,.3,3.0,7.6,concrete);
box(14.0,.8,-1.3,2.0,1.2,.7,glass);
box(14.0,.9,-6.7,2.4,1.3,.7,wood);

/* MASTER PATIO */
box(20,.25,-15.2,12,.5,5.2,wood);
box(20,1.1,-17.1,8,.12,.12,dark);

/* REAR TERRACE */
box(0,.25,-18.0,30,.5,5.0,wood);

/* POOL OPTION */
box(0,.12,-25,24,.25,8,M(0x527f8c));
box(0,.26,-25,21,.05,6,M(0x7fb5bb));

/* landscaping */
for(const [x,z] of [[-31,16],[-31,-16],[31,16],[31,-16],[-28,-25],[28,-25]]) cyl(x,1,z,1.0,2,green);

/* LABELS */
function label(txt,x,y,z){
 const c=document.createElement("canvas");c.width=900;c.height=100;
 const ctx=c.getContext("2d");ctx.fillStyle="rgba(0,0,0,.62)";ctx.roundRect(5,10,890,80,16);ctx.fill();
 ctx.fillStyle="#fff";ctx.font="bold 42px Arial";ctx.textAlign="center";ctx.fillText(txt,450,61);
 const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true}));
 s.position.set(x,y,z);s.scale.set(5.2,.58,1);scene.add(s);
}
label("LIVING ROOM",0,2.9,5);label("DINING",-6.4,2.9,-4);label("KITCHEN",3,2.9,-9);
label("BEDROOM 1",-20,2.9,8);label("BEDROOM 2",-20,2.9,-10);label("MASTER BEDROOM",20,2.9,7);

/* TELEPORT SPOTS */
const spots=[
["FRONT VERANDA",0,16.2],["LIVING ROOM",0,7],["DINING",-6.4,-4],["KITCHEN",3,-10],
["BEDROOM 1",-20,8],["BEDROOM 2",-20,-10],["MASTER BEDROOM",20,7],
["MASTER PATIO",20,-15],["REAR TERRACE",0,-18]
];
const spotMat=new THREE.MeshStandardMaterial({color:0x19a9ff,emissive:0x087ac5,emissiveIntensity:2});
const spotMeshes=[];
for(const [name,x,z] of spots){
 const g=new THREE.Group();g.position.set(x,.10,z);
 const m=new THREE.Mesh(new THREE.CylinderGeometry(.68,.68,.10,32),spotMat);g.add(m);
 const ring=new THREE.Mesh(new THREE.TorusGeometry(.8,.8,.08,32),new THREE.MeshBasicMaterial({color:0x8edfff}));ring.rotation.x=Math.PI/2;ring.position.y=.07;g.add(ring);
 g.userData={name,x,z};scene.add(g);spotMeshes.push(g);
}

/* CONTROLLERS + RAYS */
const controllers=[renderer.xr.getController(0),renderer.xr.getController(1)];
const raycasters=[];
controllers.forEach((c,i)=>{
 scene.add(c);
 const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0),new THREE.Vector3(0,0,-8)]),new THREE.LineBasicMaterial({color:0x4fc3ff}));
 c.add(line);
 const rc=new THREE.Raycaster();raycasters.push(rc);
 c.addEventListener("selectstart",()=>teleportFromController(i));
});

function teleportFromController(i){
 const c=controllers[i];const origin=new THREE.Vector3();const dir=new THREE.Vector3(0,0,-1);
 c.getWorldPosition(origin);dir.applyQuaternion(c.getWorldQuaternion(new THREE.Quaternion())).normalize();
 raycasters[i].set(origin,dir);
 const hits=raycasters[i].intersectObjects(spotMeshes,true);
 if(hits.length){
   let o=hits[0].object;while(o&&!o.userData.name)o=o.parent;
   if(o){rig.position.set(o.userData.x,0,o.userData.z+1.1);roomText.textContent=o.userData.name}
 }
}

/* robust thumbstick locomotion: inspect ALL XR input sources */
function locomotion(){
 if(!renderer.xr.isPresenting)return;
 const session=renderer.xr.getSession(); if(!session)return;
 let axisX=0,axisY=0;
 for(const src of session.inputSources){
   const gp=src.gamepad;if(!gp)continue;
   const handed=src.handedness;
   if(handed==="left"){
     const a=gp.axes;
     if(a.length>=4){axisX=a[2]||0;axisY=a[3]||0}
     else if(a.length>=2){axisX=a[0]||0;axisY=a[1]||0}
     break;
   }
 }
 if(Math.abs(axisX)<.15)axisX=0;if(Math.abs(axisY)<.15)axisY=0;
 if(axisX===0&&axisY===0)return;
 const q=new THREE.Quaternion();camera.getWorldQuaternion(q);
 const forward=new THREE.Vector3(0,0,-1).applyQuaternion(q);forward.y=0;forward.normalize();
 const right=new THREE.Vector3(1,0,0).applyQuaternion(q);right.y=0;right.normalize();
 const move=new THREE.Vector3().addScaledVector(right,axisX).addScaledVector(forward,-axisY);
 if(move.lengthSq()>0)move.normalize();
 rig.position.addScaledVector(move,.075);
 rig.position.x=THREE.MathUtils.clamp(rig.position.x,-34,34);
 rig.position.z=THREE.MathUtils.clamp(rig.position.z,-30,30);
}

addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
renderer.setAnimationLoop(()=>{locomotion();renderer.render(scene,camera)});
</script>
</body>
</html>
